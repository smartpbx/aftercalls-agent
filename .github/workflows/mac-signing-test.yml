name: mac-signing-test

# Throwaway validation for #68 — proves the APPLE_* secrets produce a
# Developer-ID-signed + notarized + stapled .app/.dmg BEFORE the real
# release.yml is switched over. Manual-dispatch only; builds nothing
# into the release/updater channel. Delete this file (and its branch)
# once release.yml carries the signing env.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sign-and-verify:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
          key: aarch64-apple-darwin

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Same pinned sidecar fetch as release.yml's macOS step — the
      # sidecar must be present so notarization scans the exact bundle
      # shape a real release ships (nested-binary signing is one of the
      # classic notarization rejections we're here to catch).
      - name: Fetch ffmpeg sidecar (macOS)
        env:
          FFMPEG_URL_ARM: "https://www.osxexperts.net/ffmpeg711arm.zip"
          FFMPEG_SHA256_ARM: "59e39a5cec2e5d2307ed079c53227a9181e64b87454ed4de998349e044bfdc70"
        run: |
          set -eux
          mkdir -p src-tauri/binaries
          curl -sSL "$FFMPEG_URL_ARM" -o /tmp/ffmpeg.zip
          echo "${FFMPEG_SHA256_ARM}  /tmp/ffmpeg.zip" | shasum -a 256 -c -
          mkdir -p /tmp/ffmpeg-stage
          unzip -o /tmp/ffmpeg.zip -d /tmp/ffmpeg-stage
          FFMPEG_BIN=$(find /tmp/ffmpeg-stage -name ffmpeg -type f | head -n1)
          cp "$FFMPEG_BIN" src-tauri/binaries/ffmpeg-aftercalls-aarch64-apple-darwin
          chmod +x src-tauri/binaries/ffmpeg-aftercalls-aarch64-apple-darwin

      - name: Build signed + notarized bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -eux
          pnpm tauri build --target aarch64-apple-darwin

      - name: Verify signature + notarization
        run: |
          set -eux
          BUNDLE_DIR="src-tauri/target/aarch64-apple-darwin/release/bundle"
          APP="$BUNDLE_DIR/macos/aftercalls.app"
          DMG=$(ls "$BUNDLE_DIR"/dmg/*.dmg | head -n1)

          echo "=== codesign identity + flags ==="
          codesign -dvv --verbose=4 "$APP" 2>&1 | tee /tmp/codesign-info.txt
          grep -q "Developer ID Application" /tmp/codesign-info.txt
          # Hardened runtime flag must be present or notarization would
          # have been rejected anyway — assert it explicitly.
          codesign -d --verbose=2 "$APP" 2>&1 | grep -E "flags=.*runtime"

          echo "=== deep strict verification ==="
          codesign --verify --deep --strict --verbose=2 "$APP"

          echo "=== sidecar is signed ==="
          codesign -dvv "$APP/Contents/MacOS/ffmpeg-aftercalls" 2>&1 \
            | grep -q "Developer ID Application"

          echo "=== Gatekeeper assessment (.app) ==="
          spctl --assess --type exec --verbose=2 "$APP" 2>&1 | tee /tmp/spctl-app.txt
          grep -q "accepted" /tmp/spctl-app.txt

          echo "=== stapled ticket (.app) ==="
          xcrun stapler validate "$APP"

          # Soft checks: Tauri notarizes + staples the .app; the .dmg
          # container may be signed-only. Gatekeeper assesses the app
          # at launch, so these warn rather than fail.
          echo "=== Gatekeeper assessment (.dmg, informational) ==="
          spctl --assess --type open --context context:primary-signature \
            --verbose=2 "$DMG" 2>&1 | tee /tmp/spctl-dmg.txt || true
          grep -q "accepted" /tmp/spctl-dmg.txt \
            || echo "WARN: dmg container not accepted standalone (app-level notarization still covers launch)"

          echo "=== stapled ticket (.dmg, informational) ==="
          xcrun stapler validate "$DMG" || echo "WARN: dmg not stapled (app-level staple covers first launch)"

          echo "=== updater bundle contains the signed app ==="
          mkdir -p /tmp/updater-check && cd /tmp/updater-check
          tar -xzf "$GITHUB_WORKSPACE/$BUNDLE_DIR/macos/"*.app.tar.gz
          codesign --verify --deep --strict --verbose=2 aftercalls.app
          codesign -dvv aftercalls.app 2>&1 | grep -q "Developer ID Application"

      - name: Upload bundles for manual QA
        uses: actions/upload-artifact@v4
        with:
          name: mac-signing-test-bundles
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          retention-days: 7
