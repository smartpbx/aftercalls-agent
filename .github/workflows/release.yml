name: release

# Operational safety gate: the first job fails unless a repository administrator
# records review of this exact FFmpeg + build-recipe revision in the repository
# variable described below. The checks are defence in depth, not a substitute
# for that distribution/compliance review.
# Signed installers + updater manifests from an explicit master-branch manual
# dispatch. Creating a tag alone never exposes signing or publication secrets.
#
# This lives in the PUBLIC repo on purpose. Two reasons, and both matter:
#   1. Cost — public repositories get unlimited free GitHub-hosted Actions
#      minutes. A private-repo release burns ~300 billable minutes per tag
#      (Windows bills 2x), which does not fit the release cadence.
#   2. Security — environment protection rules (required reviewers) are
#      available on public repositories at every plan tier, and were NOT
#      available on the private repo's plan.
# The v0.21 audit's hardening (manual dispatch, master-ref guard, exact-tip tag
# validation, SHA-pinned actions, scoped per-job tokens, and the FFmpeg
# distribution gate) is preserved verbatim — only the host repo differs.
# tauri-action
# signs with TAURI_SIGNING_PRIVATE_KEY + _PASSWORD from repo secrets,
# uploads installers + .sig files + latest.json to a draft GitHub
# release, and the follow-up publish-to-spaces job mirrors everything
# to the DO Spaces updater channel the installed apps poll.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  ffmpeg-compliance-gate:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}

      - name: Require review of the exact FFmpeg distribution inputs
        env:
          EXPECTED_REVIEW: ffmpeg-1fdbca85aaea513c9cc6c14d347f76543346d3da+btbn-a99e8230eae00d1cee38f23076a7a1f55cd984e2
          RECORDED_REVIEW: ${{ vars.FFMPEG_DISTRIBUTION_REVIEW }}
        run: |
          set -euo pipefail
          if [[ "$RECORDED_REVIEW" != "$EXPECTED_REVIEW" ]]; then
            echo "::error title=FFmpeg distribution review required::Set FFMPEG_DISTRIBUTION_REVIEW to the exact reviewed revision after completing the license/corresponding-source inventory"
            exit 1
          fi
          grep -Fq '1fdbca85aaea513c9cc6c14d347f76543346d3da' THIRD_PARTY_NOTICES.md
          grep -Fq 'a99e8230eae00d1cee38f23076a7a1f55cd984e2' THIRD_PARTY_NOTICES.md
          grep -Fq '58057a52db17bd2fefa87f271956f04aa2277d55efc13f288594cc2c65c59479' scripts/fetch-ffmpeg-sidecar.sh
          grep -Fq 'b7c1c846dacca68ee4ebf5c390742c973b3d5d14a6d44b061f500d8e4ac74fc0' scripts/fetch-ffmpeg-sidecar.ps1

  bootstrap-release:
    needs: ffmpeg-compliance-gate
    # Create the draft exactly once before the platform matrix fans out. Both
    # tauri-action jobs otherwise race to create/update the same release.
    if: github.ref == 'refs/heads/master'
    environment: production-release
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag }}

      - name: Validate and create the draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          TRUSTED_MASTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release tag: $TAG"
            exit 1
          fi
          test "$(git describe --tags --exact-match HEAD)" = "$TAG"
          test "$(git rev-parse HEAD)" = "$TRUSTED_MASTER_SHA"
          APP_VERSION="$(jq -r .version src-tauri/tauri.conf.json)"
          test "v${APP_VERSION}" = "$TAG"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --draft \
              --title "aftercalls $TAG" \
              --notes "Signed aftercalls desktop installers and updater metadata."
          fi

  release:
    needs: bootstrap-release
    # workflow_dispatch can target another ref; fail closed unless the trusted
    # workflow definition was dispatched from master.
    if: github.ref == 'refs/heads/master'
    # Anchor release deployments to one named environment. This repository is
    # public, so environment protection rules (required reviewers, wait timers)
    # ARE available and should stay configured on `production-release` — that is
    # a control the private repo's plan could not offer. The workflow keeps its
    # own belt-and-braces checks regardless: manual dispatch only, master ref,
    # and an exact-tip tag match.
    environment: production-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Validate exact release tag and application version
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          # workflow_dispatch was admitted only from refs/heads/master above.
          # This context value remains the trusted master tip even though the
          # working tree was subsequently checked out at the requested tag.
          TRUSTED_MASTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release tag: $TAG"
            exit 1
          fi
          if [ "$(git describe --tags --exact-match HEAD)" != "$TAG" ]; then
            echo "::error::Checked-out commit is not the requested exact tag $TAG"
            exit 1
          fi
          APP_VERSION="$(jq -r .version src-tauri/tauri.conf.json)"
          if [ "v${APP_VERSION}" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match tauri.conf.json version v${APP_VERSION}"
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$TRUSTED_MASTER_SHA" ]; then
            echo "::error::Release tag $TAG must point at the master tip selected for this dispatch"
            exit 1
          fi

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libasound2-dev \
            mold \
            clang \
            build-essential \
            curl \
            wget \
            file

      - name: Point rustc at mold
        if: matrix.os == 'ubuntu-24.04'
        run: |
          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml <<'EOF'
          [target.x86_64-unknown-linux-gnu]
          linker = "clang"
          rustflags = ["-C", "link-arg=-fuse-ld=mold"]
          EOF

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.95.0

      - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 10.33.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.11.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Fetch pinned ffmpeg sidecar (Linux)
        if: matrix.os == 'ubuntu-24.04'
        run: bash scripts/fetch-ffmpeg-sidecar.sh

      - name: Fetch pinned ffmpeg sidecar (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./scripts/fetch-ffmpeg-sidecar.ps1

      - name: Expose verified ffmpeg to Rust tests (Linux)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          set -euo pipefail
          TOOLS_DIR="$RUNNER_TEMP/aftercalls-test-tools"
          mkdir -p "$TOOLS_DIR"
          install -m 0755 \
            src-tauri/binaries/ffmpeg-aftercalls-x86_64-unknown-linux-gnu \
            "$TOOLS_DIR/ffmpeg"
          echo "$TOOLS_DIR" >> "$GITHUB_PATH"

      - name: Expose verified ffmpeg to Rust tests (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $toolsDir = Join-Path $env:RUNNER_TEMP "aftercalls-test-tools"
          New-Item -ItemType Directory -Force -Path $toolsDir | Out-Null
          Copy-Item "src-tauri/binaries/ffmpeg-aftercalls-x86_64-pc-windows-msvc.exe" (Join-Path $toolsDir "ffmpeg.exe")
          Add-Content -Path $env:GITHUB_PATH -Value $toolsDir

      - name: Type-check frontend
        run: pnpm check

      - name: Audit production JS dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: pnpm audit --prod --audit-level high

      - name: Test Rust core
        working-directory: src-tauri
        env:
          CARGO_BUILD_JOBS: 2
          CARGO_INCREMENTAL: 0
          CARGO_PROFILE_TEST_DEBUG: 0
        run: cargo test --locked --lib

      - name: Test atomic ffmpeg publication
        working-directory: src-tauri
        env:
          CARGO_BUILD_JOBS: 2
          CARGO_INCREMENTAL: 0
          CARGO_PROFILE_TEST_DEBUG: 0
        run: >-
          cargo test --locked --lib
          rolling_encode::tests::fallback_round_trip_publishes_only_after_full_decode
          -- --ignored --exact

      - name: Install RustSec scanner
        if: matrix.os == 'ubuntu-24.04'
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit Rust dependencies
        if: matrix.os == 'ubuntu-24.04'
        working-directory: src-tauri
        run: cargo audit --file Cargo.lock

      - name: Build + publish signed release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "aftercalls ${{ inputs.tag || github.ref_name }}"
          releaseBody: |
            Installers and auto-updater manifests for aftercalls
            ${{ inputs.tag || github.ref_name }}.

            ### Install
            - **Linux**: `.AppImage` is the default — slim, links against
              system `libwebkit2gtk-4.1` + `libgtk-3`. Also available:
              `.deb` (Debian / Ubuntu / Pop), `.rpm` (Fedora / RHEL).
            - **Windows**: `.msi` or `.exe` (NSIS).

            Both shipped desktop platforms auto-update from a running
            instance (Linux updates via AppImage-in-place swap).
          releaseDraft: true
          prerelease: false
          # Only one matrix leg may own latest.json; parallel writes race on the
          # release asset ID. Linux is injected after the slim AppImage is signed.
          includeUpdaterJson: ${{ matrix.os == 'windows-latest' }}
          # Skip tauri-bundler's AppImage on Linux — it invokes
          # linuxdeploy-plugin-gtk.sh which bundles a forked webkit that
          # SIGABRTs on Arch / NixOS / some Ubuntu combos. We build a
          # slim system-webkit AppImage ourselves in the next step.
          args: ${{ matrix.os == 'ubuntu-24.04' && '--bundles deb rpm' || '' }}

      # Slim system-webkit AppImage. tauri-bundler's AppImage target
      # unconditionally runs linuxdeploy-plugin-gtk.sh, which bundles a
      # forked libwebkit2gtk-4.1 that SIGABRTs renderer-side on Arch,
      # NixOS, and some Ubuntu combos (see #1). We've skipped that
      # target via `--bundles deb rpm` above and build our own AppImage
      # here with appimagetool, which does no dependency scanning at all —
      # the binary dynamic-links against the host's webkit at runtime, same
      # as the sysweblink tarball. Requires libwebkit2gtk-4.1 + libgtk-3
      # installed on the user's system (preinstalled on Debian/Ubuntu;
      # one package on Arch/Fedora).
      #
      # Signed with the same Tauri minisign key as the other updater
      # bundles so tauri-plugin-updater can in-place-swap it. That
      # closes the "Linux has no one-click update" gap (#31).
      - name: Package slim (system-webkit) Linux AppImage
        if: matrix.os == 'ubuntu-24.04'
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          # The upstream `continuous` asset is mutable. Never execute it
          # unless it matches the exact artifact audited for this workflow.
          APPIMAGETOOL_SHA256: a6d71e2b6cd66f8e8d16c37ad164658985e0cf5fcaa950c90a482890cb9d13e0
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          APPIMAGE_NAME="aftercalls_${VERSION}_amd64.AppImage"

          # Use appimagetool directly — NOT linuxdeploy. linuxdeploy runs
          # ldd on the binary and bundles every "non-system" lib it finds,
          # including libwebkit2gtk-4.1.so.0. That bundled webkit has its
          # helper-process paths (WebKitNetworkProcess et al) HARDCODED at
          # compile time against Ubuntu's
          # /usr/lib/x86_64-linux-gnu/webkit2gtk-4.1/ layout, which does not
          # exist on Arch / Fedora / NixOS. The app then launches and
          # SIGTRAPs the moment webkit spawns a child process.
          #
          # v0.31.0 shipped a linuxdeploy-built AppImage and reproduced
          # exactly that: a 123 MB image bundling 90 MB of webkit that
          # crashed on launch on Arch. Going direct with appimagetool skips
          # the ldd step entirely — the image carries only our own binaries,
          # and dlopen resolves webkit/gtk from the host package whose
          # helper paths match its own layout. Do not "modernize" this back
          # to linuxdeploy.
          curl --fail --show-error --location --retry 3 \
            --output appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          printf '%s  %s\n' "$APPIMAGETOOL_SHA256" appimagetool.AppImage \
            | sha256sum --check --strict -
          chmod +x appimagetool.AppImage

          APPDIR=slim-appdir
          rm -rf "$APPDIR" "$APPIMAGE_NAME" "$APPIMAGE_NAME.sig"
          mkdir -p "$APPDIR/usr/bin" \
                   "$APPDIR/usr/share/applications" \
                   "$APPDIR/usr/share/icons/hicolor/128x128/apps" \
                   "$APPDIR/usr/share/doc/aftercalls"
          cp src-tauri/target/release/agent "$APPDIR/usr/bin/aftercalls"
          chmod +x "$APPDIR/usr/bin/aftercalls"
          # Sidecar ffmpeg next to the main binary so ffmpeg_binary() in
          # pipeline.rs resolves it at runtime. Tauri's externalBin does this
          # for .deb/.rpm/.msi, but this hand-rolled AppImage bypasses
          # tauri-bundler, so copy it manually.
          cp src-tauri/binaries/ffmpeg-aftercalls-x86_64-unknown-linux-gnu \
             "$APPDIR/usr/bin/ffmpeg-aftercalls"
          chmod +x "$APPDIR/usr/bin/ffmpeg-aftercalls"
          # The bundled FFmpeg's own licence + our notices ride inside the
          # image, matching what the .deb/.rpm/.msi bundle via resources.
          cp src-tauri/resources/FFmpeg-LICENSE.txt \
             "$APPDIR/usr/share/doc/aftercalls/FFmpeg-LICENSE.txt"
          cp src-tauri/resources/THIRD_PARTY_NOTICES.md \
             "$APPDIR/usr/share/doc/aftercalls/THIRD_PARTY_NOTICES.md"
          cp src-tauri/icons/128x128.png \
             "$APPDIR/usr/share/icons/hicolor/128x128/apps/aftercalls.png"
          # appimagetool expects the .desktop + icon at the AppDir root.
          cp src-tauri/icons/128x128.png "$APPDIR/aftercalls.png"
          cat > "$APPDIR/aftercalls.desktop" <<DESKTOP
          [Desktop Entry]
          Name=aftercalls
          Comment=Call recording + transcription
          Exec=aftercalls
          Icon=aftercalls
          Terminal=false
          Type=Application
          Categories=AudioVideo;Recorder;
          DESKTOP
          cat > "$APPDIR/AppRun" <<'APPRUN'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "$HERE/usr/bin/aftercalls" "$@"
          APPRUN
          chmod +x "$APPDIR/AppRun"

          test -x "$APPDIR/usr/bin/ffmpeg-aftercalls"
          test -s "$APPDIR/usr/share/doc/aftercalls/FFmpeg-LICENSE.txt"
          test -s "$APPDIR/usr/share/doc/aftercalls/THIRD_PARTY_NOTICES.md"

          ARCH=x86_64 ./appimagetool.AppImage --no-appstream \
            "$APPDIR" "$APPIMAGE_NAME"
          chmod +x "$APPIMAGE_NAME"
          ls -la "$APPIMAGE_NAME"

          # Fail closed if the host GUI stack leaked back in: a bundled
          # webkit/gtk is the exact regression this step exists to prevent.
          if ./"$APPIMAGE_NAME" --appimage-offset >/dev/null 2>&1; then
            "./$APPIMAGE_NAME" --appimage-extract 'usr/lib/*' >/dev/null 2>&1 || true
            if find squashfs-root -name 'libwebkit2gtk*' -o -name 'libgtk-3*' 2>/dev/null | grep -q .; then
              echo "::error::AppImage bundled webkit/gtk — it will crash on non-Ubuntu hosts"
              exit 1
            fi
            rm -rf squashfs-root
          fi

      - name: Sign slim Linux AppImage
        if: matrix.os == 'ubuntu-24.04'
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          APPIMAGE_NAME="aftercalls_${VERSION}_amd64.AppImage"
          # Sign with the Tauri minisign key. `-k` takes the base64
          # key *content* (not a path) — a tempfile path trips the
          # base64 decode with `Invalid symbol 46 at offset 8` (the
          # `.` in `/tmp/tmp.XXX`). This step never executes the downloaded
          # packaging binary and has no repository-write token.
          pnpm exec tauri signer sign \
            -k "$TAURI_SIGNING_PRIVATE_KEY" \
            -p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" \
            "$APPIMAGE_NAME"
          ls -la "$APPIMAGE_NAME.sig"

      - name: Upload slim Linux AppImage
        if: matrix.os == 'ubuntu-24.04'
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          APPIMAGE_NAME="aftercalls_${VERSION}_amd64.AppImage"
          # Attach to the draft release. --clobber handles reruns.
          gh release upload "$TAG" \
            "$APPIMAGE_NAME" "$APPIMAGE_NAME.sig" \
            --clobber

      - name: Attach pinned FFmpeg corresponding source
        if: matrix.os == 'ubuntu-24.04'
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SOURCE_DIR="$RUNNER_TEMP/aftercalls-ffmpeg-source"
          mkdir -p "$SOURCE_DIR"
          FFMPEG_SOURCE="$SOURCE_DIR/ffmpeg-source-1fdbca85aaea513c9cc6c14d347f76543346d3da.tar.gz"
          BUILD_SOURCE="$SOURCE_DIR/ffmpeg-build-scripts-a99e8230eae00d1cee38f23076a7a1f55cd984e2.tar.gz"
          curl --fail --show-error --location --retry 3 \
            --output "$FFMPEG_SOURCE" \
            https://codeload.github.com/FFmpeg/FFmpeg/tar.gz/1fdbca85aaea513c9cc6c14d347f76543346d3da
          curl --fail --show-error --location --retry 3 \
            --output "$BUILD_SOURCE" \
            https://codeload.github.com/BtbN/FFmpeg-Builds/tar.gz/a99e8230eae00d1cee38f23076a7a1f55cd984e2
          printf '%s  %s\n' \
            1312ecd4b87383182530278450c204c27e6787d033b190a28072a149cca59ed3 \
            "$FFMPEG_SOURCE" \
            | sha256sum --check --strict -
          printf '%s  %s\n' \
            7deac4a5190b2be84d4d548db2885d05152f9e3d77069d0e34841a46efd95e2b \
            "$BUILD_SOURCE" \
            | sha256sum --check --strict -
          gh release upload "$TAG" \
            "$FFMPEG_SOURCE" "$BUILD_SOURCE" \
            --clobber

      # Keep the sysweblink tarball too for users who prefer a plain
      # binary layout (package managers, NixOS overlays, etc). Same
      # binary as the slim AppImage — just packaged as tar.gz with an
      # install.md.
      - name: Package system-linked Linux tarball
        if: matrix.os == 'ubuntu-24.04'
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          STAGE="dist/aftercalls"
          mkdir -p "$STAGE"
          cp src-tauri/target/release/agent "$STAGE/aftercalls"
          chmod +x "$STAGE/aftercalls"
          cp src-tauri/binaries/ffmpeg-aftercalls-x86_64-unknown-linux-gnu \
             "$STAGE/ffmpeg-aftercalls"
          chmod +x "$STAGE/ffmpeg-aftercalls"
          cp src-tauri/resources/FFmpeg-LICENSE.txt \
             "$STAGE/FFmpeg-LICENSE.txt"
          cp src-tauri/resources/THIRD_PARTY_NOTICES.md \
             "$STAGE/THIRD_PARTY_NOTICES.md"
          cp src-tauri/icons/128x128.png "$STAGE/aftercalls.png"
          cat > "$STAGE/aftercalls.desktop" <<DESKTOP
          [Desktop Entry]
          Name=aftercalls
          Comment=Call recording + transcription
          Exec=/opt/aftercalls/aftercalls
          Icon=/opt/aftercalls/aftercalls.png
          Terminal=false
          Type=Application
          Categories=AudioVideo;Recorder;
          DESKTOP
          cat > "$STAGE/INSTALL.md" <<'DOC'
          # aftercalls — system-linked Linux tarball

          Raw binary layout for users who don't want AppImage. Dynamic-
          links to your distro's libwebkit2gtk-4.1 + libgtk-3, same as
          the AppImage we ship.

          ## Requirements

          - libwebkit2gtk-4.1 (Arch: `webkit2gtk-4.1`; Debian:
            `libwebkit2gtk-4.1-0`)
          - libgtk-3
          A checksum-verified LGPL FFmpeg sidecar is included next to the
          aftercalls executable; no system FFmpeg install is required.

          ## Install

          ```
          sudo mkdir -p /opt/aftercalls
          sudo cp aftercalls /opt/aftercalls/aftercalls
          sudo cp ffmpeg-aftercalls /opt/aftercalls/ffmpeg-aftercalls
          sudo cp aftercalls.png /opt/aftercalls/aftercalls.png
          sudo cp aftercalls.desktop /usr/share/applications/aftercalls.desktop
          sudo mkdir -p /usr/share/doc/aftercalls
          sudo cp FFmpeg-LICENSE.txt THIRD_PARTY_NOTICES.md /usr/share/doc/aftercalls/
          sudo chmod +x /opt/aftercalls/aftercalls /opt/aftercalls/ffmpeg-aftercalls
          ```

          ## Updates

          Tauri's in-place auto-updater only swaps AppImage installs
          (it can't touch an /opt binary). You'll still see the
          "update available" pill inside the app — click to jump to
          https://app.aftercalls.io/downloads and grab the new tarball.
          DOC
          cd dist
          tar czf "../aftercalls-${TAG}-linux-x86_64-sysweblink.tar.gz" aftercalls
          cd ..
          gh release upload "$TAG" \
            "aftercalls-${TAG}-linux-x86_64-sysweblink.tar.gz" \
            --clobber

  # Mirror installers + manifest to the public Spaces updater bucket
  # so running apps can poll for updates without hitting the private
  # repo on GitHub. Injects a linux-x86_64 entry pointing at our slim
  # system-webkit AppImage — tauri-action didn't emit a Linux updater
  # entry (we passed --bundles deb rpm to skip its crashy AppImage),
  # so we add it here from the .sig file produced by the slim-
  # AppImage step above.
  publish-to-spaces:
    needs: release
    environment: production-release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      # write is required by the final undraft step; the job still reads
      # assets through the API rather than mutating anything before Spaces.
      contents: write
    steps:
      - name: Download release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/release
          cd /tmp/release
          # `gh release download` resolves by tag and cannot see a DRAFT
          # release, but bootstrap-release deliberately creates one and
          # tauri-action uploads into it (releaseDraft: true). Resolve the
          # release by id and pull each asset through the API instead, which
          # works for drafts. Publishing happens only after Spaces succeeds.
          REPO="${{ github.repository }}"
          REL_ID=$(gh api "repos/$REPO/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n1)
          if [ -z "$REL_ID" ]; then
            echo "::error::No release found for tag $TAG"
            exit 1
          fi
          gh api "repos/$REPO/releases/$REL_ID/assets" --paginate \
            --jq '.[] | "\(.id)\t\(.name)"' \
          | while IFS=$'\t' read -r asset_id asset_name; do
              echo "downloading $asset_name"
              gh api -H "Accept: application/octet-stream" \
                "repos/$REPO/releases/assets/$asset_id" > "$asset_name"
            done
          ls -la
          test -f latest.json

      - name: Rewrite latest.json URLs to Spaces + inject Linux entry
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          BUCKET: ${{ secrets.SPACES_BUCKET }}
          REGION: ${{ secrets.SPACES_REGION }}
        run: |
          set -eu
          VERSION="${TAG#v}"
          BASE="https://${BUCKET}.${REGION}.digitaloceanspaces.com/${TAG}"
          SLIM_APPIMAGE="aftercalls_${VERSION}_amd64.AppImage"

          if [ ! -f "/tmp/release/${SLIM_APPIMAGE}.sig" ]; then
            echo "FATAL: slim AppImage signature missing — the slim-"
            echo "AppImage build step must have failed upstream."
            ls -la /tmp/release/
            exit 1
          fi
          # `tauri signer sign` writes the .sig file with its contents
          # already base64-encoded (same format tauri-bundler emits).
          # The manifest signature field wants that base64 string as-is
          # — an extra `base64 -w0` here would double-encode and every
          # Linux updater check would fail signature verification.
          LINUX_SIG=$(cat "/tmp/release/${SLIM_APPIMAGE}.sig")

          # 1. Rewrite every existing platform URL to point at Spaces
          #    instead of github.com (running apps hit Spaces since the
          #    GitHub release is private).
          # 2. Inject linux-x86_64 entry for the slim AppImage —
          #    tauri-action didn't emit one since we built AppImage
          #    ourselves outside its pipeline.
          jq --arg base "$BASE" \
             --arg linuxurl "$BASE/$SLIM_APPIMAGE" \
             --arg linuxsig "$LINUX_SIG" '
            .platforms |= (
              with_entries(
                .value.url = ($base + "/" + (.value.url | split("/") | .[-1]))
              )
            )
            | .platforms["linux-x86_64"] = { signature: $linuxsig, url: $linuxurl }
          ' /tmp/release/latest.json > /tmp/release/latest.rewritten.json
          mv /tmp/release/latest.rewritten.json /tmp/release/latest.json
          echo "--- latest.json after rewrite + linux-inject ---"
          cat /tmp/release/latest.json

      - name: Upload to Spaces
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          AWS_EC2_METADATA_DISABLED: "true"
          TAG: ${{ inputs.tag || github.ref_name }}
          BUCKET: ${{ secrets.SPACES_BUCKET }}
          REGION: ${{ secrets.SPACES_REGION }}
        run: |
          ENDPOINT="https://${REGION}.digitaloceanspaces.com"
          for f in /tmp/release/*; do
            name=$(basename "$f")
            aws s3 cp "$f" "s3://${BUCKET}/${TAG}/${name}" \
              --endpoint-url "$ENDPOINT" \
              --acl public-read
          done
          aws s3 cp /tmp/release/latest.json "s3://${BUCKET}/latest.json" \
            --endpoint-url "$ENDPOINT" \
            --acl public-read \
            --cache-control "max-age=60, public"
          echo "Published update channel: https://${BUCKET}.${REGION}.digitaloceanspaces.com/latest.json"

      # Only now is the release real: the updater channel is live and every
      # asset is mirrored. Undrafting last means a failed Spaces upload never
      # surfaces a release users can half-download. Nothing published this
      # before, so every release stayed a permanent draft.
      - name: Publish the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false
