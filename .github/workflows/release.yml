name: release

# Signed installers + updater manifests on every `v*` tag. tauri-action
# signs with TAURI_SIGNING_PRIVATE_KEY + _PASSWORD from repo secrets,
# uploads installers + .sig files + latest.json to a draft GitHub
# release, and the follow-up publish-to-spaces job mirrors everything
# to the DO Spaces updater channel the installed apps poll.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libasound2-dev \
            mold \
            clang \
            build-essential \
            curl \
            wget \
            file

      - name: Point rustc at mold
        if: matrix.os == 'ubuntu-24.04'
        run: |
          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml <<'EOF'
          [target.x86_64-unknown-linux-gnu]
          linker = "clang"
          rustflags = ["-C", "link-arg=-fuse-ld=mold"]
          EOF

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Build + publish signed release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "aftercalls ${{ github.event.inputs.tag || github.ref_name }}"
          releaseBody: |
            Installers and auto-updater manifests for aftercalls
            ${{ github.event.inputs.tag || github.ref_name }}.

            ### Install
            - **Linux**: prefer the `-linux-x86_64-sysweblink.tar.gz`
              (stable, links against system webkit2gtk). Alternatively
              the `.deb` on Debian/Ubuntu. The AppImage is included
              but has known stability issues on some distros.
            - **Windows**: download the `.msi` or the NSIS `.exe`.

            Windows + macOS auto-update from a running instance; Linux
            users grab a new tarball per release (see `/downloads` on
            the portal).
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true

      # System-linked Linux tarball. The AppImage that tauri-action
      # produces bundles libwebkit2gtk-4.1 via linuxdeploy-plugin-gtk,
      # and that bundled build crashes renderer-side on some distros.
      # This tarball ships just the agent binary + icon + desktop
      # entry, dynamically linked against system webkit — stable
      # wherever libwebkit2gtk-4.1 is installed (Arch, NixOS, Debian,
      # Ubuntu). Lives as a normal release asset; the portal's
      # /downloads page picks it up via the updater manifest.
      - name: Package system-linked Linux tarball
        if: matrix.os == 'ubuntu-24.04'
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          STAGE="dist/aftercalls"
          mkdir -p "$STAGE"
          cp src-tauri/target/release/agent "$STAGE/aftercalls"
          chmod +x "$STAGE/aftercalls"
          cp src-tauri/icons/128x128.png "$STAGE/aftercalls.png"
          cat > "$STAGE/aftercalls.desktop" <<DESKTOP
          [Desktop Entry]
          Name=aftercalls
          Comment=Call recording + transcription
          Exec=/opt/aftercalls/aftercalls
          Icon=/opt/aftercalls/aftercalls.png
          Terminal=false
          Type=Application
          Categories=AudioVideo;Recorder;
          DESKTOP
          cat > "$STAGE/INSTALL.md" <<'DOC'
          # aftercalls — system-linked Linux build

          This tarball is the aftercalls desktop agent linked against
          your distro's webkit2gtk-4.1 + gtk-3. Use this when the
          AppImage build is unstable on your distro — most common on
          Arch and NixOS.

          ## Requirements

          - libwebkit2gtk-4.1 (Arch: `webkit2gtk-4.1`; Debian:
            `libwebkit2gtk-4.1-0`)
          - libgtk-3
          - ffmpeg (optional — agent falls back to raw WAV upload if
            ffmpeg isn't in PATH)

          ## Install

          ```
          sudo mkdir -p /opt/aftercalls
          sudo cp aftercalls /opt/aftercalls/aftercalls
          sudo cp aftercalls.png /opt/aftercalls/aftercalls.png
          sudo cp aftercalls.desktop /usr/share/applications/aftercalls.desktop
          sudo chmod +x /opt/aftercalls/aftercalls
          ```

          ## Updates

          The built-in updater expects an AppImage and cannot swap a
          plain binary in place. Watch
          https://app.aftercalls.io/downloads and grab a new tarball
          per release.
          DOC
          cd dist
          tar czf "../aftercalls-${TAG}-linux-x86_64-sysweblink.tar.gz" aftercalls
          cd ..
          gh release upload "$TAG" \
            "aftercalls-${TAG}-linux-x86_64-sysweblink.tar.gz" \
            --clobber

  # Mirror installers + manifest to the public Spaces updater bucket
  # so running apps can poll for updates without hitting the private
  # repo on GitHub. Only Windows/macOS entries survive into
  # latest.json — Linux AppImage updates are intentionally disabled
  # since the bundled webkit crashes on several distros; Linux users
  # grab a new tarball per release instead.
  publish-to-spaces:
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          mkdir -p /tmp/release
          cd /tmp/release
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern '*'
          ls -la

      - name: Rewrite latest.json URLs to Spaces + strip Linux
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          BUCKET: ${{ secrets.SPACES_BUCKET }}
          REGION: ${{ secrets.SPACES_REGION }}
        run: |
          BASE="https://${BUCKET}.${REGION}.digitaloceanspaces.com/${TAG}"
          jq --arg base "$BASE" '
            .platforms |= (
              with_entries(
                .value.url = ($base + "/" + (.value.url | split("/") | .[-1]))
              )
              | with_entries(select(.key | startswith("linux-") | not))
            )
          ' /tmp/release/latest.json > /tmp/release/latest.rewritten.json
          mv /tmp/release/latest.rewritten.json /tmp/release/latest.json
          echo "--- latest.json after rewrite + linux-strip ---"
          cat /tmp/release/latest.json

      - name: Upload to Spaces
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          AWS_EC2_METADATA_DISABLED: "true"
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          BUCKET: ${{ secrets.SPACES_BUCKET }}
          REGION: ${{ secrets.SPACES_REGION }}
        run: |
          ENDPOINT="https://${REGION}.digitaloceanspaces.com"
          for f in /tmp/release/*; do
            name=$(basename "$f")
            aws s3 cp "$f" "s3://${BUCKET}/${TAG}/${name}" \
              --endpoint-url "$ENDPOINT" \
              --acl public-read
          done
          aws s3 cp /tmp/release/latest.json "s3://${BUCKET}/latest.json" \
            --endpoint-url "$ENDPOINT" \
            --acl public-read \
            --cache-control "max-age=60, public"
          echo "Published update channel: https://${BUCKET}.${REGION}.digitaloceanspaces.com/latest.json"
