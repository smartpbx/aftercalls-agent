name: release

# Signed installers + updater manifests on every `v*` tag. tauri-action
# signs with TAURI_SIGNING_PRIVATE_KEY + _PASSWORD from repo secrets,
# uploads installers + .sig files + latest.json to a draft GitHub
# release, and the follow-up publish-to-spaces job mirrors everything
# to the DO Spaces updater channel the installed apps poll.
#
# macOS (Apple Silicon) builds run `pnpm tauri build` directly (NOT
# tauri-action) and are Developer-ID-signed + notarized + stapled:
# tauri-bundler reads the APPLE_* secrets itself (temp keychain,
# `notarytool submit --wait`, `stapler staple` — verified against
# tauri-bundler v2.9.2 source, 2026-06-10). A hard verification step
# (`spctl --assess` + `stapler validate`) guards the two silent
# failure modes: missing notarization creds only WARN in the bundler,
# and stapler's exit status is unchecked upstream. Signed bundles
# attach to the GH release and publish to Spaces like Linux/Windows.
#
# Windows Authenticode signing is pre-wired but INERT until the
# AZURE_* secrets exist (Azure Artifact Signing, #67 in the private
# repo) — see the "Enable Windows code signing" step.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
  VITE_SENTRY_ENVIRONMENT: production
  # Windows Authenticode via Azure Artifact Signing flips on when all
  # six secrets exist; until then the Windows build ships unsigned
  # exactly as before. `secrets` isn't usable in step `if:` directly,
  # hence the env indirection.
  HAS_AZURE_SIGNING: ${{ secrets.AZURE_ARTIFACT_ENDPOINT != '' && secrets.AZURE_ARTIFACT_ACCOUNT != '' && secrets.AZURE_ARTIFACT_PROFILE != '' && secrets.AZURE_TENANT_ID != '' && secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_CLIENT_SECRET != '' }}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Create the GitHub release once, before the matrix fans out, so
  # all three matrix jobs (Linux, Windows, macOS) operate on a release
  # that already exists. v0.18.0 ran without this and we hit two
  # parallel-matrix races:
  #   1. macOS's "Attach macOS bundles" ran before tauri-action on
  #      Linux had created the release → `gh release upload` 404'd.
  #   2. Both Linux and Windows tauri-action invocations tried to
  #      PATCH latest.json on the same release → the second one's
  #      asset-id was stale and 404'd.
  # Bootstrap-first removes (1) entirely; the `includeUpdaterJson`
  # gating below removes (2).
  bootstrap-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Create release if missing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "release $TAG already exists; matrix jobs will reuse it"
            exit 0
          fi
          gh release create "$TAG" \
            --repo "$REPO" \
            --title "aftercalls $TAG" \
            --notes "Installers and auto-updater manifests for aftercalls $TAG.

          ### Install

          - **Linux**: AppImage (default), .deb (Debian / Ubuntu / Pop), .rpm (Fedora / RHEL).
          - **Windows**: .msi or .exe.
          - **macOS**: .dmg (Apple Silicon; Intel Macs run it via Rosetta 2).

          All platforms auto-update from a running instance.

          See [aftercalls.io/releases](https://aftercalls.io/releases/) for the full changelog."

  release:
    needs: bootstrap-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          # `experimental: true` flips per-job continue-on-error so the
          # publish-to-spaces job can fire after Linux + Windows even
          # when a macOS runner is queued or Apple's notary service is
          # down. Cost of that resilience: a failed mac job ships the
          # release WITHOUT mac assets and latest.json omits
          # darwin-aarch64 until the next tag — check the job status
          # after every release.
          #
          # 2026-04-25: macos-13 (Intel) dropped from the matrix —
          # GitHub deprecated the label in late 2025 and our jobs sat
          # in queue 7+ hours. Apple Silicon (macos-14, aarch64) covers
          # native ARM builds; Intel-Mac users run via Rosetta 2.
          - os: macos-14
            target: aarch64-apple-darwin
            experimental: true

    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libasound2-dev \
            mold \
            clang \
            build-essential \
            curl \
            wget \
            file

      - name: Point rustc at mold
        if: matrix.os == 'ubuntu-24.04'
        run: |
          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml <<'EOF'
          [target.x86_64-unknown-linux-gnu]
          linker = "clang"
          rustflags = ["-C", "link-arg=-fuse-ld=mold"]
          EOF

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
          # Bucket the cache by target triple so the two macOS runners
          # don't fight over the same key.
          key: ${{ matrix.target }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Provision the ffmpeg sidecar for the current target.
      #
      # Linux + Windows both delegate to scripts/fetch-ffmpeg-sidecar.*,
      # which are MIRRORED from the private repo and are the single source
      # of truth for which build ships. They pin the same BtbN LGPL
      # archive per platform (sha256-verified), assert the exact
      # `ffmpeg -version` identity, require libopus, refuse any
      # --enable-gpl / --enable-nonfree configuration, and — critically —
      # populate src-tauri/resources/ with the archive's own LICENSE.txt
      # plus THIRD_PARTY_NOTICES.md.
      #
      # That resources/ step is not optional: tauri.conf.json declares
      # bundle.resources, and tauri-build copies declared resources
      # unconditionally in strict mode, so a missing file panics the build
      # script on every platform. Do NOT reintroduce an inline fetch here —
      # it will drift from the notices table and break the bundle.
      #
      # Tauri's externalBin picks up
      # src-tauri/binaries/ffmpeg-aftercalls-<triple> at bundle time and
      # drops it next to the main binary, so users need no ffmpeg on PATH.
      - name: Fetch pinned ffmpeg sidecar (Linux)
        if: matrix.os == 'ubuntu-24.04'
        run: bash scripts/fetch-ffmpeg-sidecar.sh

      - name: Fetch pinned ffmpeg sidecar (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./scripts/fetch-ffmpeg-sidecar.ps1

      # macOS sidecar — osxexperts.net ships LGPL-only static builds
      # for Apple Silicon (and Intel; Intel matrix entry currently
      # disabled, see top-of-file comment). Same license posture as
      # the Linux/Windows sidecars above. The archive layout is a flat
      # zip containing a single `ffmpeg` binary.
      #
      # The osxexperts URLs are *already* version-pinned in the
      # filename (`ffmpeg711arm.zip` = 7.1.1 arm). #69 adds the
      # matching sha256 fail-loud check so a silent re-tag at the
      # same URL would break CI before shipping.
      - name: Fetch ffmpeg sidecar (macOS)
        if: startsWith(matrix.os, 'macos-')
        env:
          # Pinned per #69. Bump URL + SHA256 together (and notices)
          # when rolling forward.
          FFMPEG_URL_ARM: "https://www.osxexperts.net/ffmpeg711arm.zip"
          FFMPEG_SHA256_ARM: "59e39a5cec2e5d2307ed079c53227a9181e64b87454ed4de998349e044bfdc70"
          FFMPEG_URL_INTEL: "https://www.osxexperts.net/ffmpeg711intel.zip"
          # Intel matrix entry is currently dropped (macos-13 deprecated).
          # When re-added, compute + pin its sha256 here too.
          FFMPEG_SHA256_INTEL: ""
        run: |
          set -eux
          mkdir -p src-tauri/binaries
          if [ "${{ matrix.target }}" = "aarch64-apple-darwin" ]; then
            URL="$FFMPEG_URL_ARM"
            EXPECTED_SHA="$FFMPEG_SHA256_ARM"
          else
            URL="$FFMPEG_URL_INTEL"
            EXPECTED_SHA="$FFMPEG_SHA256_INTEL"
          fi
          curl -sSL "$URL" -o /tmp/ffmpeg.zip
          echo "ffmpeg archive sha256:"
          shasum -a 256 /tmp/ffmpeg.zip
          if [ -n "$EXPECTED_SHA" ]; then
            echo "${EXPECTED_SHA}  /tmp/ffmpeg.zip" | shasum -a 256 -c -
          else
            echo "WARN: no pinned sha256 for this macOS arch — recording for later pin"
          fi
          mkdir -p /tmp/ffmpeg-stage
          unzip -o /tmp/ffmpeg.zip -d /tmp/ffmpeg-stage
          # The zip contains a single top-level `ffmpeg` binary.
          FFMPEG_BIN=$(find /tmp/ffmpeg-stage -name ffmpeg -type f | head -n1)
          cp "$FFMPEG_BIN" \
            "src-tauri/binaries/ffmpeg-aftercalls-${{ matrix.target }}"
          chmod +x "src-tauri/binaries/ffmpeg-aftercalls-${{ matrix.target }}"
          echo "bundled binary sha256:"
          shasum -a 256 "src-tauri/binaries/ffmpeg-aftercalls-${{ matrix.target }}"
          ls -lh src-tauri/binaries/

          # tauri.conf.json declares bundle.resources, and tauri-build
          # copies declared resources unconditionally in strict mode — a
          # missing file panics the build script. Linux/Windows get these
          # from scripts/fetch-ffmpeg-sidecar.*, which lift LICENSE.txt out
          # of the pinned BtbN archive. The osxexperts zip is a flat archive
          # holding only the binary, so there is no builder-supplied license
          # to bundle and this leg cannot satisfy the same standard.
          #
          # THIRD_PARTY_NOTICES.md currently states we publish no macOS
          # installer or macOS sidecar, and v0.30.0 shipped Linux + Windows
          # only. This job is `experimental: true`, so failing here does not
          # block the release — it fails loudly and legibly instead of as an
          # opaque Rust panic 20 minutes later. To actually ship macOS:
          # source a verified LGPL mac build that carries its license, add a
          # macOS branch to fetch-ffmpeg-sidecar.sh, and update the notices
          # table + site/licenses in the same commit.
          mkdir -p src-tauri/resources
          cp THIRD_PARTY_NOTICES.md src-tauri/resources/THIRD_PARTY_NOTICES.md
          MAC_LICENSE=$(find /tmp/ffmpeg-stage \
            \( -iname 'LICENSE*' -o -iname 'COPYING*' \) -type f | head -n1)
          if [ -z "$MAC_LICENSE" ]; then
            echo "::error::macOS ffmpeg archive carries no license file, so"
            echo "::error::src-tauri/resources/FFmpeg-LICENSE.txt cannot be"
            echo "::error::populated and the bundle would ship without the"
            echo "::error::LGPL text. Not shipping a macOS installer — see"
            echo "::error::THIRD_PARTY_NOTICES.md. This job is non-blocking."
            exit 1
          fi
          cp "$MAC_LICENSE" src-tauri/resources/FFmpeg-LICENSE.txt
          grep -Fq 'GNU LESSER GENERAL PUBLIC LICENSE' \
            src-tauri/resources/FFmpeg-LICENSE.txt \
            || { echo "::error::macOS ffmpeg license is not LGPL"; exit 1; }
          ls -lh src-tauri/resources/

      # Inert until the founder finishes Azure Artifact Signing setup
      # (#67 in the private repo) and sets six secrets on THIS repo:
      # AZURE_ARTIFACT_ENDPOINT (e.g. https://eus.codesigning.azure.net),
      # AZURE_ARTIFACT_ACCOUNT, AZURE_ARTIFACT_PROFILE (cert profile
      # name), AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET.
      # Once present, this step installs the signing CLI and drops a
      # tauri.windows.conf.json overlay (auto-merged by Tauri) whose
      # signCommand signs the inner .exe AND the NSIS/MSI installers
      # during bundling. Account/profile names stay out of this public
      # file by living in secrets.
      - name: Enable Windows code signing (Azure Artifact Signing)
        if: matrix.os == 'windows-latest' && env.HAS_AZURE_SIGNING == 'true'
        shell: pwsh
        env:
          AZURE_ARTIFACT_ENDPOINT: ${{ secrets.AZURE_ARTIFACT_ENDPOINT }}
          AZURE_ARTIFACT_ACCOUNT: ${{ secrets.AZURE_ARTIFACT_ACCOUNT }}
          AZURE_ARTIFACT_PROFILE: ${{ secrets.AZURE_ARTIFACT_PROFILE }}
        run: |
          cargo install artifact-signing-cli --locked
          $signCommand = "artifact-signing-cli -e $env:AZURE_ARTIFACT_ENDPOINT -a $env:AZURE_ARTIFACT_ACCOUNT -c $env:AZURE_ARTIFACT_PROFILE -d aftercalls %1"
          @{ bundle = @{ windows = @{ signCommand = $signCommand } } } |
            ConvertTo-Json -Depth 4 |
            Set-Content -Path src-tauri/tauri.windows.conf.json -Encoding UTF8
          Write-Host "signCommand overlay written"

      - name: Build + publish signed release (Linux + Windows)
        if: matrix.os == 'ubuntu-24.04' || matrix.os == 'windows-latest'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Auth for artifact-signing-cli (no-ops while unset).
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "aftercalls ${{ github.event.inputs.tag || github.ref_name }}"
          releaseBody: |
            Installers and auto-updater manifests for aftercalls
            ${{ github.event.inputs.tag || github.ref_name }}.

            ### Install

            - **Linux**: AppImage (default), .deb (Debian / Ubuntu / Pop), .rpm (Fedora / RHEL).
            - **Windows**: .msi or .exe.
            - **macOS**: .dmg (Apple Silicon; Intel Macs run it via Rosetta 2).

            All platforms auto-update from a running instance.

            See [aftercalls.io/releases](https://aftercalls.io/releases/) for the full changelog.
          releaseDraft: false
          prerelease: false
          # Only Windows emits latest.json. v0.18.0 had both Linux and
          # Windows tauri-action invocations set to true, and they raced
          # on the PATCH of the latest.json release asset — the second
          # job's asset-id was stale and 404'd. Linux contributes
          # nothing to the updater manifest anyway (we ship deb/rpm
          # only via tauri-bundler; the slim AppImage updater entry is
          # injected by publish-to-spaces downstream), so dropping it
          # here is lossless.
          includeUpdaterJson: ${{ matrix.os == 'windows-latest' }}
          # Skip tauri-bundler's AppImage on Linux — it invokes
          # linuxdeploy-plugin-gtk.sh which bundles a forked webkit that
          # SIGABRTs on Arch / NixOS / some Ubuntu combos. We build a
          # slim system-webkit AppImage ourselves in the next step.
          args: ${{ matrix.os == 'ubuntu-24.04' && '--bundles deb rpm' || '' }}

      # macOS — build .dmg + .app via tauri-bundler directly (NOT
      # tauri-action; we keep our own staging/attach steps so asset
      # names carry the target triple). With the APPLE_* env present,
      # tauri-bundler imports the cert into a temp keychain, signs
      # everything inside-out (ffmpeg sidecar first, then the .app),
      # runs `xcrun notarytool submit --wait`, and staples the ticket
      # — no extra keychain/notary steps needed. The .p12 in
      # APPLE_CERTIFICATE must contain ONLY the Developer ID
      # Application identity (bundler picks the first identity it
      # finds); APPLE_SIGNING_IDENTITY is a substring cross-check.
      #
      # Pass --target so the runner produces a single-arch bundle
      # matching the matrix triple.
      - name: Build signed + notarized macOS bundles
        if: startsWith(matrix.os, 'macos-')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -eux
          pnpm tauri build --target ${{ matrix.target }}
          ls -la "src-tauri/target/${{ matrix.target }}/release/bundle/dmg/" || true
          ls -la "src-tauri/target/${{ matrix.target }}/release/bundle/macos/" || true

      # Hard gate against the two silent failure modes in tauri-bundler:
      # missing/incomplete notarization creds only log a WARNING (the
      # build stays green and ships un-notarized), and `stapler staple`'s
      # exit status is never checked. A release only attaches mac
      # bundles if the .app genuinely passes Gatekeeper.
      - name: Verify macOS signature + notarization
        if: startsWith(matrix.os, 'macos-')
        run: |
          set -eux
          APP="src-tauri/target/${{ matrix.target }}/release/bundle/macos/aftercalls.app"
          codesign -dvv "$APP" 2>&1 | grep "Developer ID Application"
          codesign -d --verbose=2 "$APP" 2>&1 | grep -E "flags=.*runtime"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dvv "$APP/Contents/MacOS/ffmpeg-aftercalls" 2>&1 \
            | grep "Developer ID Application"
          spctl --assess --type exec --verbose=2 "$APP" 2>&1 | grep "accepted"
          xcrun stapler validate "$APP"

      - name: Stage macOS bundles
        if: startsWith(matrix.os, 'macos-')
        run: |
          set -eux
          STAGE=/tmp/macos-stage
          mkdir -p "$STAGE"
          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle"
          # First-install installer: .dmg — Developer-ID-signed, app
          # inside is notarized + stapled.
          if [ -d "$BUNDLE_DIR/dmg" ]; then
            cp "$BUNDLE_DIR/dmg/"*.dmg "$STAGE/" 2>/dev/null || true
          fi
          # Updater bundle: Tauri auto-produces a minisign-signed
          # *.app.tar.gz + .sig in bundle/macos/ when
          # createUpdaterArtifacts=true (set in tauri.conf.json). Copy
          # both, renaming with the target triple so the GH release
          # listing identifies the arch.
          if [ -d "$BUNDLE_DIR/macos" ]; then
            cd "$BUNDLE_DIR/macos"
            for app_tgz in *.app.tar.gz; do
              [ -f "$app_tgz" ] || continue
              TAR_NAME="${app_tgz%.app.tar.gz}-${{ matrix.target }}.app.tar.gz"
              cp "$app_tgz" "$STAGE/$TAR_NAME"
              if [ -f "${app_tgz}.sig" ]; then
                cp "${app_tgz}.sig" "$STAGE/${TAR_NAME}.sig"
              fi
            done
            cd -
          fi
          ls -la "$STAGE"

      - name: Upload macOS workflow artifact
        if: startsWith(matrix.os, 'macos-')
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.target }}-${{ github.event.inputs.tag || github.ref_name }}
          path: /tmp/macos-stage/*
          if-no-files-found: warn
          retention-days: 30

      # Attach mac bundles to the GitHub release so publish-to-spaces
      # picks them up. Bundles are signed + notarized (the verify step
      # above fails the job otherwise, so nothing un-notarized lands
      # here).
      - name: Attach macOS bundles to GH release
        if: startsWith(matrix.os, 'macos-')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -eux
          shopt -s nullglob
          cd /tmp/macos-stage
          files=( *.dmg *.tar.gz *.tar.gz.sig )
          if [ ${#files[@]} -eq 0 ]; then
            echo "no macOS bundles to attach"
            exit 0
          fi
          # Job runs in /tmp/macos-stage with no checkout, so gh can't
          # infer the repo from .git — pass it explicitly.
          gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"

      # Slim system-webkit AppImage. tauri-bundler's AppImage target
      # unconditionally runs linuxdeploy-plugin-gtk.sh, which bundles a
      # forked libwebkit2gtk-4.1 that SIGABRTs renderer-side on Arch,
      # NixOS, and some Ubuntu combos (see #1). We've skipped that
      # target via `--bundles deb rpm` above and build our own AppImage
      # here using linuxdeploy *without* the gtk plugin — the binary
      # dynamic-links against the host's webkit at runtime, same as
      # the sysweblink tarball. Requires libwebkit2gtk-4.1 + libgtk-3
      # installed on the user's system (preinstalled on Debian/Ubuntu;
      # one package on Arch/Fedora).
      #
      # Signed with the same Tauri minisign key as the Windows/macOS
      # bundles so tauri-plugin-updater can in-place-swap it. That
      # closes the "Linux has no one-click update" gap (#31).
      - name: Package slim (system-webkit) Linux AppImage
        if: matrix.os == 'ubuntu-24.04'
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euxo pipefail
          VERSION="${TAG#v}"
          APPIMAGE_NAME="aftercalls_${VERSION}_amd64.AppImage"

          # Use appimagetool directly — NOT linuxdeploy. linuxdeploy
          # runs ldd on the binary and bundles every "non-system" lib
          # it finds, including libwebkit2gtk-4.1.so.0. That bundled
          # webkit has its helper-process paths (WebKitNetworkProcess
          # et al) HARDCODED at compile time pointing at Ubuntu's
          # /usr/lib/x86_64-linux-gnu/webkit2gtk-4.1/ layout — which
          # doesn't exist on Arch / Fedora / NixOS. Result: AppImage
          # launches but webkit crashes spawning its child processes.
          # Going direct with appimagetool skips the ldd step entirely:
          # the AppImage ships ONLY the binary + .desktop + icon, and
          # at runtime dlopen resolves webkit/gtk from the host's own
          # package (whose helper paths match its own layout).
          curl -sSL -o appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage

          APPDIR=slim-appdir
          rm -rf "$APPDIR" "$APPIMAGE_NAME" "$APPIMAGE_NAME.sig"
          mkdir -p "$APPDIR/usr/bin" \
                   "$APPDIR/usr/share/applications" \
                   "$APPDIR/usr/share/icons/hicolor/128x128/apps"
          cp src-tauri/target/release/agent "$APPDIR/usr/bin/aftercalls"
          chmod +x "$APPDIR/usr/bin/aftercalls"
          # Sidecar ffmpeg next to the main binary so ffmpeg_binary()
          # in pipeline.rs resolves it at runtime. Tauri's externalBin
          # does this automatically for .deb/.rpm/.msi but our hand-
          # rolled AppImage path bypasses tauri-bundler, so we copy
          # manually here.
          cp src-tauri/binaries/ffmpeg-aftercalls-x86_64-unknown-linux-gnu \
             "$APPDIR/usr/bin/ffmpeg-aftercalls"
          chmod +x "$APPDIR/usr/bin/ffmpeg-aftercalls"
          cp src-tauri/icons/128x128.png \
             "$APPDIR/usr/share/icons/hicolor/128x128/apps/aftercalls.png"
          # appimagetool expects the .desktop + icon at the AppDir root.
          cp src-tauri/icons/128x128.png "$APPDIR/aftercalls.png"
          cat > "$APPDIR/aftercalls.desktop" <<DESKTOP
          [Desktop Entry]
          Name=aftercalls
          Comment=Call recording + transcription
          Exec=aftercalls
          Icon=aftercalls
          Terminal=false
          Type=Application
          Categories=AudioVideo;Recorder;
          DESKTOP
          # AppRun is the entrypoint appimagetool wires up. Exec the
          # agent binary with all args forwarded.
          cat > "$APPDIR/AppRun" <<'APPRUN'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "$HERE/usr/bin/aftercalls" "$@"
          APPRUN
          chmod +x "$APPDIR/AppRun"

          # ARCH= is required by appimagetool. --no-appstream skips
          # the AppStream metadata warning (we don't publish there).
          ARCH=x86_64 ./appimagetool.AppImage --no-appstream \
            "$APPDIR" "$APPIMAGE_NAME"
          chmod +x "$APPIMAGE_NAME"
          ls -la "$APPIMAGE_NAME"

          # Sign with the Tauri minisign key. `-k` takes the base64
          # key *content* (not a path) — a tempfile path trips the
          # base64 decode with `Invalid symbol 46 at offset 8` (the
          # `.` in `/tmp/tmp.XXX`). The secret is already masked in
          # Actions logs; /proc/cmdline exposure on an ephemeral runner
          # is the same posture tauri-action uses internally.
          pnpm exec tauri signer sign \
            -k "$TAURI_SIGNING_PRIVATE_KEY" \
            -p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" \
            "$APPIMAGE_NAME"
          ls -la "$APPIMAGE_NAME.sig"

          # Attach to the draft release. --clobber handles reruns.
          gh release upload "$TAG" \
            "$APPIMAGE_NAME" "$APPIMAGE_NAME.sig" \
            --clobber

      # Keep the sysweblink tarball too for users who prefer a plain
      # binary layout (package managers, NixOS overlays, etc). Same
      # binary as the slim AppImage — just packaged as tar.gz with an
      # install.md.
      - name: Package system-linked Linux tarball
        if: matrix.os == 'ubuntu-24.04'
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          STAGE="dist/aftercalls"
          mkdir -p "$STAGE"
          cp src-tauri/target/release/agent "$STAGE/aftercalls"
          chmod +x "$STAGE/aftercalls"
          cp src-tauri/binaries/ffmpeg-aftercalls-x86_64-unknown-linux-gnu \
             "$STAGE/ffmpeg-aftercalls"
          chmod +x "$STAGE/ffmpeg-aftercalls"
          cp src-tauri/icons/128x128.png "$STAGE/aftercalls.png"
          cat > "$STAGE/aftercalls.desktop" <<DESKTOP
          [Desktop Entry]
          Name=aftercalls
          Comment=Call recording + transcription
          Exec=/opt/aftercalls/aftercalls
          Icon=/opt/aftercalls/aftercalls.png
          Terminal=false
          Type=Application
          Categories=AudioVideo;Recorder;
          DESKTOP
          cat > "$STAGE/INSTALL.md" <<'DOC'
          # aftercalls — system-linked Linux tarball

          Raw binary layout for users who don't want AppImage. Dynamic-
          links to your distro's libwebkit2gtk-4.1 + libgtk-3, same as
          the AppImage we ship.

          ## Requirements

          - libwebkit2gtk-4.1 (Arch: `webkit2gtk-4.1`; Debian:
            `libwebkit2gtk-4.1-0`)
          - libgtk-3

          ffmpeg is bundled with the app (`ffmpeg-aftercalls` sits
          next to the main binary) — no separate install needed.

          ## Install

          ```
          sudo mkdir -p /opt/aftercalls
          sudo cp aftercalls /opt/aftercalls/aftercalls
          sudo cp ffmpeg-aftercalls /opt/aftercalls/ffmpeg-aftercalls
          sudo cp aftercalls.png /opt/aftercalls/aftercalls.png
          sudo cp aftercalls.desktop /usr/share/applications/aftercalls.desktop
          sudo chmod +x /opt/aftercalls/aftercalls /opt/aftercalls/ffmpeg-aftercalls
          ```

          ## Updates

          Tauri's in-place auto-updater only swaps AppImage installs
          (it can't touch an /opt binary). You'll still see the
          "update available" pill inside the app — click to jump to
          https://app.aftercalls.io/downloads and grab the new tarball.
          DOC
          cd dist
          tar czf "../aftercalls-${TAG}-linux-x86_64-sysweblink.tar.gz" aftercalls
          cd ..
          gh release upload "$TAG" \
            "aftercalls-${TAG}-linux-x86_64-sysweblink.tar.gz" \
            --clobber

  # Mirror installers + manifest to the public Spaces updater bucket
  # so running apps can poll for updates without hitting the private
  # repo on GitHub. Injects a linux-x86_64 entry pointing at our slim
  # system-webkit AppImage — tauri-action didn't emit a Linux updater
  # entry (we passed --bundles deb rpm to skip its crashy AppImage),
  # so we add it here from the .sig file produced by the slim-
  # AppImage step above.
  #
  # macOS bundles (signed + notarized) attach to the GH release, so
  # the .dmg + .app.tar.gz/.sig land here via `gh release download`
  # and get mirrored to Spaces + injected into latest.json as
  # `darwin-aarch64`.
  publish-to-spaces:
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          mkdir -p /tmp/release
          cd /tmp/release
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern '*'
          ls -la

      - name: Rewrite latest.json URLs to Spaces + inject Linux + macOS entries
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          BUCKET: ${{ secrets.SPACES_BUCKET }}
          REGION: ${{ secrets.SPACES_REGION }}
        run: |
          set -eu
          VERSION="${TAG#v}"
          BASE="https://${BUCKET}.${REGION}.digitaloceanspaces.com/${TAG}"
          SLIM_APPIMAGE="aftercalls_${VERSION}_amd64.AppImage"

          if [ ! -f "/tmp/release/${SLIM_APPIMAGE}.sig" ]; then
            echo "FATAL: slim AppImage signature missing — the slim-"
            echo "AppImage build step must have failed upstream."
            ls -la /tmp/release/
            exit 1
          fi
          # `tauri signer sign` writes the .sig file with its contents
          # already base64-encoded (same format tauri-bundler emits).
          # The manifest signature field wants that base64 string as-is
          # — an extra `base64 -w0` here would double-encode and every
          # Linux updater check would fail signature verification.
          LINUX_SIG=$(cat "/tmp/release/${SLIM_APPIMAGE}.sig")

          # macOS Apple Silicon updater bundle — Tauri's
          # *.app.tar.gz + .sig from bundle/macos/. The .dmg is the
          # first-install path (surfaced via /v1/downloads); the
          # updater channel only cares about the .app.tar.gz. Optional
          # so a runner outage doesn't FATAL the whole publish.
          DARWIN_AARCH64_TGZ="aftercalls-aarch64-apple-darwin.app.tar.gz"
          if [ -f "/tmp/release/${DARWIN_AARCH64_TGZ}.sig" ]; then
            DARWIN_AARCH64_SIG=$(cat "/tmp/release/${DARWIN_AARCH64_TGZ}.sig")
            DARWIN_AARCH64_URL="$BASE/$DARWIN_AARCH64_TGZ"
          else
            DARWIN_AARCH64_SIG=""
            DARWIN_AARCH64_URL=""
          fi

          # 1. Rewrite every existing platform URL to point at Spaces
          #    instead of github.com (running apps hit Spaces since the
          #    GitHub release is private).
          # 2. Inject linux-x86_64 entry for the slim AppImage.
          # 3. Inject darwin-aarch64 entry for the mac .dmg (when present).
          jq --arg base "$BASE" \
             --arg linuxurl "$BASE/$SLIM_APPIMAGE" \
             --arg linuxsig "$LINUX_SIG" \
             --arg macarmurl "$DARWIN_AARCH64_URL" \
             --arg macarmsig "$DARWIN_AARCH64_SIG" '
            .platforms |= (
              with_entries(
                .value.url = ($base + "/" + (.value.url | split("/") | .[-1]))
              )
            )
            | .platforms["linux-x86_64"] = { signature: $linuxsig, url: $linuxurl }
            | if $macarmurl != "" then
                .platforms["darwin-aarch64"] = { signature: $macarmsig, url: $macarmurl }
              else . end
          ' /tmp/release/latest.json > /tmp/release/latest.rewritten.json
          mv /tmp/release/latest.rewritten.json /tmp/release/latest.json
          echo "--- latest.json after rewrites ---"
          cat /tmp/release/latest.json

      - name: Upload to Spaces
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          AWS_EC2_METADATA_DISABLED: "true"
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          BUCKET: ${{ secrets.SPACES_BUCKET }}
          REGION: ${{ secrets.SPACES_REGION }}
        run: |
          ENDPOINT="https://${REGION}.digitaloceanspaces.com"
          for f in /tmp/release/*; do
            name=$(basename "$f")
            aws s3 cp "$f" "s3://${BUCKET}/${TAG}/${name}" \
              --endpoint-url "$ENDPOINT" \
              --acl public-read
          done
          aws s3 cp /tmp/release/latest.json "s3://${BUCKET}/latest.json" \
            --endpoint-url "$ENDPOINT" \
            --acl public-read \
            --cache-control "max-age=60, public"
          echo "Published update channel: https://${BUCKET}.${REGION}.digitaloceanspaces.com/latest.json"
