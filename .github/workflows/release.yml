name: release

# Signed installers + updater manifests on every `v*` tag. tauri-action
# signs with TAURI_SIGNING_PRIVATE_KEY + _PASSWORD from repo secrets,
# uploads installers + .sig files + latest.json to a draft GitHub
# release, and the follow-up publish-to-spaces job mirrors everything
# to the DO Spaces updater channel the installed apps poll.
#
# macOS (Intel + Apple Silicon) builds are gated artifact-only until
# code-signing + notarization land (see #41 / #68). The Mac job runs
# `pnpm tauri build` directly (NOT tauri-action) so its outputs DON'T
# get attached to the GitHub release, then uploads the .dmg as a
# workflow artifact for internal QA. The publish-to-spaces job only
# pulls assets that ARE attached to the release, so unsigned mac
# bundles never reach the public updater channel. Flip
# `enable_mac_publish: true` on workflow_dispatch (after #68 lands)
# to attach + publish.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true
      enable_mac_publish:
        description: "Attach macOS .dmg to GH release + publish to Spaces. Leave false until signing (#68) lands; default uploads .dmg as a workflow artifact only."
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          # macOS entries are conservative: build artifacts only, no
          # GitHub-release attachment + no Spaces publish unless
          # workflow_dispatch input `enable_mac_publish` is true. See
          # the comment on `enable_mac_publish` for the gating rationale.
          #
          # `experimental: true` flips per-job continue-on-error so the
          # publish-to-spaces job can fire after Linux + Windows even
          # when a macOS runner is queued (#41 follow-up).
          #
          # 2026-04-25: macos-13 (Intel) dropped from the matrix —
          # GitHub deprecated the label in late 2025 and our jobs sat
          # in queue 7+ hours. Apple Silicon (macos-14, aarch64) covers
          # native ARM builds; Intel-Mac users run via Rosetta 2 until
          # signing (#68) + a paid macos-13-large self-hosted alt land.
          - os: macos-14
            target: aarch64-apple-darwin
            experimental: true

    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libasound2-dev \
            mold \
            clang \
            build-essential \
            curl \
            wget \
            file

      - name: Point rustc at mold
        if: matrix.os == 'ubuntu-24.04'
        run: |
          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml <<'EOF'
          [target.x86_64-unknown-linux-gnu]
          linker = "clang"
          rustflags = ["-C", "link-arg=-fuse-ld=mold"]
          EOF

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
          # Bucket the cache by target triple so the two macOS runners
          # don't fight over the same key.
          key: ${{ matrix.target }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Fetch the ffmpeg sidecar for the current target. Tauri's
      # externalBin picks up src-tauri/binaries/ffmpeg-aftercalls-<triple>
      # at bundle time and drops it next to the main binary in the
      # installed app. This removes the need for users to have
      # ffmpeg on PATH — mix_tracks + compress_for_upload both resolve
      # the sidecar first, falling back to PATH for dev.
      - name: Fetch ffmpeg sidecar (Linux)
        if: matrix.os == 'ubuntu-24.04'
        env:
          # Pinned per #69 — the same exact archive every CI run consumes,
          # so a customer filing an LGPL §6 source request months from
          # now gets the binary that actually shipped, not whatever
          # rolled to "latest" that day. Bump both lines together when
          # rolling forward (and update THIRD_PARTY_NOTICES.md +
          # site/licenses/index.html in the same commit).
          FFMPEG_URL: "https://johnvansickle.com/ffmpeg/releases/ffmpeg-7.0.2-amd64-static.tar.xz"
          FFMPEG_SHA256: "abda8d77ce8309141f83ab8edf0596834087c52467f6badf376a6a2a4c87cf67"
        run: |
          set -eux
          mkdir -p src-tauri/binaries
          # John Van Sickle static build — fully static LGPL build,
          # works on any glibc distro without additional libs.
          curl -sSL "$FFMPEG_URL" -o /tmp/ffmpeg.tar.xz
          echo "ffmpeg archive sha256:"
          sha256sum /tmp/ffmpeg.tar.xz
          # Fail-loud if upstream changes the bytes under us. The pin
          # is the contract with anyone filing a corresponding-source
          # request — if it moves, we want the build to break before
          # we ship a binary we can't reproduce.
          echo "${FFMPEG_SHA256}  /tmp/ffmpeg.tar.xz" | sha256sum -c -
          mkdir -p /tmp/ffmpeg-stage
          tar -xJf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg-stage --strip-components=1
          cp /tmp/ffmpeg-stage/ffmpeg \
            src-tauri/binaries/ffmpeg-aftercalls-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/ffmpeg-aftercalls-x86_64-unknown-linux-gnu
          echo "bundled binary sha256:"
          sha256sum src-tauri/binaries/ffmpeg-aftercalls-x86_64-unknown-linux-gnu
          ls -lh src-tauri/binaries/

      - name: Fetch ffmpeg sidecar (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          # Pinned per #69. gyan.dev re-tags the "release" alias on
          # every upstream bump; the dated build lives in GyanD's
          # GitHub releases. Bump URL + SHA256 together (and the notices
          # files) when rolling forward.
          FFMPEG_URL: "https://github.com/GyanD/codexffmpeg/releases/download/7.1.1/ffmpeg-7.1.1-essentials_build.zip"
          FFMPEG_SHA256: "04861d3339c5ebe38b56c19a15cf2c0cc97f5de4fa8910e4d47e5e6404e4a2d4"
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
          $stage = Join-Path $env:RUNNER_TEMP "ffmpeg-stage"
          # GyanD/codexffmpeg's "essentials" build is the lightweight LGPL
          # one (~90MB unpacked) — same license posture as the Linux
          # John Van Sickle build.
          Invoke-WebRequest -UseBasicParsing `
            -Uri $env:FFMPEG_URL `
            -OutFile $zip
          Write-Host "ffmpeg archive sha256:"
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          Write-Host $hash
          if ($hash -ne $env:FFMPEG_SHA256) {
            Write-Error "ffmpeg sha256 mismatch — expected $env:FFMPEG_SHA256, got $hash"
            exit 1
          }
          Expand-Archive -Path $zip -DestinationPath $stage -Force
          $exe = (Get-ChildItem -Path $stage -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1).FullName
          Copy-Item $exe "src-tauri/binaries/ffmpeg-aftercalls-x86_64-pc-windows-msvc.exe"
          Write-Host "bundled binary sha256:"
          Get-FileHash -Algorithm SHA256 "src-tauri/binaries/ffmpeg-aftercalls-x86_64-pc-windows-msvc.exe" | Format-List Algorithm,Hash
          Get-ChildItem src-tauri/binaries/

      # macOS sidecar — osxexperts.net ships LGPL-only static builds
      # for Apple Silicon (and Intel; Intel matrix entry currently
      # disabled, see top-of-file comment). Same license posture as
      # the Linux/Windows sidecars above. The archive layout is a flat
      # zip containing a single `ffmpeg` binary.
      #
      # The osxexperts URLs are *already* version-pinned in the
      # filename (`ffmpeg711arm.zip` = 7.1.1 arm). #69 adds the
      # matching sha256 fail-loud check so a silent re-tag at the
      # same URL would break CI before shipping.
      - name: Fetch ffmpeg sidecar (macOS)
        if: startsWith(matrix.os, 'macos-')
        env:
          # Pinned per #69. Bump URL + SHA256 together (and notices)
          # when rolling forward.
          FFMPEG_URL_ARM: "https://www.osxexperts.net/ffmpeg711arm.zip"
          FFMPEG_SHA256_ARM: "59e39a5cec2e5d2307ed079c53227a9181e64b87454ed4de998349e044bfdc70"
          FFMPEG_URL_INTEL: "https://www.osxexperts.net/ffmpeg711intel.zip"
          # Intel matrix entry is currently dropped (macos-13 deprecated).
          # When re-added, compute + pin its sha256 here too.
          FFMPEG_SHA256_INTEL: ""
        run: |
          set -eux
          mkdir -p src-tauri/binaries
          if [ "${{ matrix.target }}" = "aarch64-apple-darwin" ]; then
            URL="$FFMPEG_URL_ARM"
            EXPECTED_SHA="$FFMPEG_SHA256_ARM"
          else
            URL="$FFMPEG_URL_INTEL"
            EXPECTED_SHA="$FFMPEG_SHA256_INTEL"
          fi
          curl -sSL "$URL" -o /tmp/ffmpeg.zip
          echo "ffmpeg archive sha256:"
          shasum -a 256 /tmp/ffmpeg.zip
          if [ -n "$EXPECTED_SHA" ]; then
            echo "${EXPECTED_SHA}  /tmp/ffmpeg.zip" | shasum -a 256 -c -
          else
            echo "WARN: no pinned sha256 for this macOS arch — recording for later pin"
          fi
          mkdir -p /tmp/ffmpeg-stage
          unzip -o /tmp/ffmpeg.zip -d /tmp/ffmpeg-stage
          # The zip contains a single top-level `ffmpeg` binary.
          FFMPEG_BIN=$(find /tmp/ffmpeg-stage -name ffmpeg -type f | head -n1)
          cp "$FFMPEG_BIN" \
            "src-tauri/binaries/ffmpeg-aftercalls-${{ matrix.target }}"
          chmod +x "src-tauri/binaries/ffmpeg-aftercalls-${{ matrix.target }}"
          echo "bundled binary sha256:"
          shasum -a 256 "src-tauri/binaries/ffmpeg-aftercalls-${{ matrix.target }}"
          ls -lh src-tauri/binaries/

      - name: Build + publish signed release (Linux + Windows)
        if: matrix.os == 'ubuntu-24.04' || matrix.os == 'windows-latest'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "aftercalls ${{ github.event.inputs.tag || github.ref_name }}"
          releaseBody: |
            Installers and auto-updater manifests for aftercalls
            ${{ github.event.inputs.tag || github.ref_name }}.

            ### Install

            - **Linux**: AppImage (default), .deb (Debian / Ubuntu / Pop), .rpm (Fedora / RHEL).
            - **Windows**: .msi or .exe.
            - **macOS**: .dmg (Apple Silicon). Closed-beta build is unsigned — run `xattr -cr /Applications/aftercalls.app` after install.

            All platforms auto-update from a running instance.

            See [aftercalls.io/releases](https://aftercalls.io/releases/) for the full changelog.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          # Skip tauri-bundler's AppImage on Linux — it invokes
          # linuxdeploy-plugin-gtk.sh which bundles a forked webkit that
          # SIGABRTs on Arch / NixOS / some Ubuntu combos. We build a
          # slim system-webkit AppImage ourselves in the next step.
          args: ${{ matrix.os == 'ubuntu-24.04' && '--bundles deb rpm' || '' }}

      # macOS — build .dmg + .app via tauri-bundler directly. Bypassing
      # tauri-action means the artifacts DON'T get attached to the
      # GitHub release, which is the whole point of the artifact-only
      # gate: unsigned .dmgs would launch with the "unidentified
      # developer" Gatekeeper block and we don't want them on the
      # public updater channel before #68 lands.
      #
      # Pass --target so the runner produces a single-arch bundle
      # matching the matrix triple. macos-13 → x86_64, macos-14 → arm64.
      - name: Build macOS .dmg (artifact-only)
        if: startsWith(matrix.os, 'macos-')
        env:
          # Even with no signing identity present, tauri-bundler still
          # runs ad-hoc codesign so the .app launches at all on the
          # build machine. The .dmg won't pass Gatekeeper on a fresh
          # install — that's the whole point of the gate.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -eux
          pnpm tauri build --target ${{ matrix.target }}
          ls -la "src-tauri/target/${{ matrix.target }}/release/bundle/dmg/" || true
          ls -la "src-tauri/target/${{ matrix.target }}/release/bundle/macos/" || true

      - name: Stage macOS bundles
        if: startsWith(matrix.os, 'macos-')
        run: |
          set -eux
          STAGE=/tmp/macos-stage
          mkdir -p "$STAGE"
          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle"
          # First-install installer: .dmg. Apple-unsigned during closed
          # beta — users see Gatekeeper warning + xattr -cr workaround
          # until #68 lands.
          if [ -d "$BUNDLE_DIR/dmg" ]; then
            cp "$BUNDLE_DIR/dmg/"*.dmg "$STAGE/" 2>/dev/null || true
          fi
          # Updater bundle: Tauri auto-produces a minisign-signed
          # *.app.tar.gz + .sig in bundle/macos/ when
          # createUpdaterArtifacts=true (set in tauri.conf.json). Copy
          # both, renaming with the target triple so the GH release
          # listing identifies the arch.
          if [ -d "$BUNDLE_DIR/macos" ]; then
            cd "$BUNDLE_DIR/macos"
            for app_tgz in *.app.tar.gz; do
              [ -f "$app_tgz" ] || continue
              TAR_NAME="${app_tgz%.app.tar.gz}-${{ matrix.target }}.app.tar.gz"
              cp "$app_tgz" "$STAGE/$TAR_NAME"
              if [ -f "${app_tgz}.sig" ]; then
                cp "${app_tgz}.sig" "$STAGE/${TAR_NAME}.sig"
              fi
            done
            cd -
          fi
          ls -la "$STAGE"

      - name: Upload macOS workflow artifact
        if: startsWith(matrix.os, 'macos-')
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.target }}-${{ github.event.inputs.tag || github.ref_name }}
          path: /tmp/macos-stage/*
          if-no-files-found: warn
          retention-days: 30

      # Attach mac bundles to the GitHub release so publish-to-spaces
      # picks them up. We're closed beta — testers accept the unsigned
      # Gatekeeper warning + xattr -cr workaround until #68 lands.
      # When notarization ships, this step is unchanged; the warning
      # just goes away for users.
      - name: Attach macOS bundles to GH release
        if: startsWith(matrix.os, 'macos-')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -eux
          shopt -s nullglob
          cd /tmp/macos-stage
          files=( *.dmg *.tar.gz *.tar.gz.sig )
          if [ ${#files[@]} -eq 0 ]; then
            echo "no macOS bundles to attach"
            exit 0
          fi
          # Job runs in /tmp/macos-stage with no checkout, so gh can't
          # infer the repo from .git — pass it explicitly.
          gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"

      # Slim system-webkit AppImage. tauri-bundler's AppImage target
      # unconditionally runs linuxdeploy-plugin-gtk.sh, which bundles a
      # forked libwebkit2gtk-4.1 that SIGABRTs renderer-side on Arch,
      # NixOS, and some Ubuntu combos (see #1). We've skipped that
      # target via `--bundles deb rpm` above and build our own AppImage
      # here using linuxdeploy *without* the gtk plugin — the binary
      # dynamic-links against the host's webkit at runtime, same as
      # the sysweblink tarball. Requires libwebkit2gtk-4.1 + libgtk-3
      # installed on the user's system (preinstalled on Debian/Ubuntu;
      # one package on Arch/Fedora).
      #
      # Signed with the same Tauri minisign key as the Windows/macOS
      # bundles so tauri-plugin-updater can in-place-swap it. That
      # closes the "Linux has no one-click update" gap (#31).
      - name: Package slim (system-webkit) Linux AppImage
        if: matrix.os == 'ubuntu-24.04'
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euxo pipefail
          VERSION="${TAG#v}"
          APPIMAGE_NAME="aftercalls_${VERSION}_amd64.AppImage"

          # Use appimagetool directly — NOT linuxdeploy. linuxdeploy
          # runs ldd on the binary and bundles every "non-system" lib
          # it finds, including libwebkit2gtk-4.1.so.0. That bundled
          # webkit has its helper-process paths (WebKitNetworkProcess
          # et al) HARDCODED at compile time pointing at Ubuntu's
          # /usr/lib/x86_64-linux-gnu/webkit2gtk-4.1/ layout — which
          # doesn't exist on Arch / Fedora / NixOS. Result: AppImage
          # launches but webkit crashes spawning its child processes.
          # Going direct with appimagetool skips the ldd step entirely:
          # the AppImage ships ONLY the binary + .desktop + icon, and
          # at runtime dlopen resolves webkit/gtk from the host's own
          # package (whose helper paths match its own layout).
          curl -sSL -o appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage

          APPDIR=slim-appdir
          rm -rf "$APPDIR" "$APPIMAGE_NAME" "$APPIMAGE_NAME.sig"
          mkdir -p "$APPDIR/usr/bin" \
                   "$APPDIR/usr/share/applications" \
                   "$APPDIR/usr/share/icons/hicolor/128x128/apps"
          cp src-tauri/target/release/agent "$APPDIR/usr/bin/aftercalls"
          chmod +x "$APPDIR/usr/bin/aftercalls"
          # Sidecar ffmpeg next to the main binary so ffmpeg_binary()
          # in pipeline.rs resolves it at runtime. Tauri's externalBin
          # does this automatically for .deb/.rpm/.msi but our hand-
          # rolled AppImage path bypasses tauri-bundler, so we copy
          # manually here.
          cp src-tauri/binaries/ffmpeg-aftercalls-x86_64-unknown-linux-gnu \
             "$APPDIR/usr/bin/ffmpeg-aftercalls"
          chmod +x "$APPDIR/usr/bin/ffmpeg-aftercalls"
          cp src-tauri/icons/128x128.png \
             "$APPDIR/usr/share/icons/hicolor/128x128/apps/aftercalls.png"
          # appimagetool expects the .desktop + icon at the AppDir root.
          cp src-tauri/icons/128x128.png "$APPDIR/aftercalls.png"
          cat > "$APPDIR/aftercalls.desktop" <<DESKTOP
          [Desktop Entry]
          Name=aftercalls
          Comment=Call recording + transcription
          Exec=aftercalls
          Icon=aftercalls
          Terminal=false
          Type=Application
          Categories=AudioVideo;Recorder;
          DESKTOP
          # AppRun is the entrypoint appimagetool wires up. Exec the
          # agent binary with all args forwarded.
          cat > "$APPDIR/AppRun" <<'APPRUN'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "$HERE/usr/bin/aftercalls" "$@"
          APPRUN
          chmod +x "$APPDIR/AppRun"

          # ARCH= is required by appimagetool. --no-appstream skips
          # the AppStream metadata warning (we don't publish there).
          ARCH=x86_64 ./appimagetool.AppImage --no-appstream \
            "$APPDIR" "$APPIMAGE_NAME"
          chmod +x "$APPIMAGE_NAME"
          ls -la "$APPIMAGE_NAME"

          # Sign with the Tauri minisign key. `-k` takes the base64
          # key *content* (not a path) — a tempfile path trips the
          # base64 decode with `Invalid symbol 46 at offset 8` (the
          # `.` in `/tmp/tmp.XXX`). The secret is already masked in
          # Actions logs; /proc/cmdline exposure on an ephemeral runner
          # is the same posture tauri-action uses internally.
          pnpm exec tauri signer sign \
            -k "$TAURI_SIGNING_PRIVATE_KEY" \
            -p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" \
            "$APPIMAGE_NAME"
          ls -la "$APPIMAGE_NAME.sig"

          # Attach to the draft release. --clobber handles reruns.
          gh release upload "$TAG" \
            "$APPIMAGE_NAME" "$APPIMAGE_NAME.sig" \
            --clobber

      # Keep the sysweblink tarball too for users who prefer a plain
      # binary layout (package managers, NixOS overlays, etc). Same
      # binary as the slim AppImage — just packaged as tar.gz with an
      # install.md.
      - name: Package system-linked Linux tarball
        if: matrix.os == 'ubuntu-24.04'
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          STAGE="dist/aftercalls"
          mkdir -p "$STAGE"
          cp src-tauri/target/release/agent "$STAGE/aftercalls"
          chmod +x "$STAGE/aftercalls"
          cp src-tauri/binaries/ffmpeg-aftercalls-x86_64-unknown-linux-gnu \
             "$STAGE/ffmpeg-aftercalls"
          chmod +x "$STAGE/ffmpeg-aftercalls"
          cp src-tauri/icons/128x128.png "$STAGE/aftercalls.png"
          cat > "$STAGE/aftercalls.desktop" <<DESKTOP
          [Desktop Entry]
          Name=aftercalls
          Comment=Call recording + transcription
          Exec=/opt/aftercalls/aftercalls
          Icon=/opt/aftercalls/aftercalls.png
          Terminal=false
          Type=Application
          Categories=AudioVideo;Recorder;
          DESKTOP
          cat > "$STAGE/INSTALL.md" <<'DOC'
          # aftercalls — system-linked Linux tarball

          Raw binary layout for users who don't want AppImage. Dynamic-
          links to your distro's libwebkit2gtk-4.1 + libgtk-3, same as
          the AppImage we ship.

          ## Requirements

          - libwebkit2gtk-4.1 (Arch: `webkit2gtk-4.1`; Debian:
            `libwebkit2gtk-4.1-0`)
          - libgtk-3

          ffmpeg is bundled with the app (`ffmpeg-aftercalls` sits
          next to the main binary) — no separate install needed.

          ## Install

          ```
          sudo mkdir -p /opt/aftercalls
          sudo cp aftercalls /opt/aftercalls/aftercalls
          sudo cp ffmpeg-aftercalls /opt/aftercalls/ffmpeg-aftercalls
          sudo cp aftercalls.png /opt/aftercalls/aftercalls.png
          sudo cp aftercalls.desktop /usr/share/applications/aftercalls.desktop
          sudo chmod +x /opt/aftercalls/aftercalls /opt/aftercalls/ffmpeg-aftercalls
          ```

          ## Updates

          Tauri's in-place auto-updater only swaps AppImage installs
          (it can't touch an /opt binary). You'll still see the
          "update available" pill inside the app — click to jump to
          https://app.aftercalls.io/downloads and grab the new tarball.
          DOC
          cd dist
          tar czf "../aftercalls-${TAG}-linux-x86_64-sysweblink.tar.gz" aftercalls
          cd ..
          gh release upload "$TAG" \
            "aftercalls-${TAG}-linux-x86_64-sysweblink.tar.gz" \
            --clobber

  # Mirror installers + manifest to the public Spaces updater bucket
  # so running apps can poll for updates without hitting the private
  # repo on GitHub. Injects a linux-x86_64 entry pointing at our slim
  # system-webkit AppImage — tauri-action didn't emit a Linux updater
  # entry (we passed --bundles deb rpm to skip its crashy AppImage),
  # so we add it here from the .sig file produced by the slim-
  # AppImage step above.
  #
  # macOS bundles attach to the GH release unconditionally (we're
  # closed beta — testers handle the unsigned Gatekeeper warning until
  # #68 lands), so the .dmg + .dmg.sig land here via `gh release
  # download` and get mirrored to Spaces + injected into latest.json
  # as `darwin-aarch64`.
  publish-to-spaces:
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          mkdir -p /tmp/release
          cd /tmp/release
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern '*'
          ls -la

      - name: Rewrite latest.json URLs to Spaces + inject Linux + macOS entries
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          BUCKET: ${{ secrets.SPACES_BUCKET }}
          REGION: ${{ secrets.SPACES_REGION }}
        run: |
          set -eu
          VERSION="${TAG#v}"
          BASE="https://${BUCKET}.${REGION}.digitaloceanspaces.com/${TAG}"
          SLIM_APPIMAGE="aftercalls_${VERSION}_amd64.AppImage"

          if [ ! -f "/tmp/release/${SLIM_APPIMAGE}.sig" ]; then
            echo "FATAL: slim AppImage signature missing — the slim-"
            echo "AppImage build step must have failed upstream."
            ls -la /tmp/release/
            exit 1
          fi
          # `tauri signer sign` writes the .sig file with its contents
          # already base64-encoded (same format tauri-bundler emits).
          # The manifest signature field wants that base64 string as-is
          # — an extra `base64 -w0` here would double-encode and every
          # Linux updater check would fail signature verification.
          LINUX_SIG=$(cat "/tmp/release/${SLIM_APPIMAGE}.sig")

          # macOS Apple Silicon updater bundle — Tauri's
          # *.app.tar.gz + .sig from bundle/macos/. The .dmg is the
          # first-install path (surfaced via /v1/downloads); the
          # updater channel only cares about the .app.tar.gz. Optional
          # so a runner outage doesn't FATAL the whole publish.
          DARWIN_AARCH64_TGZ="aftercalls-aarch64-apple-darwin.app.tar.gz"
          if [ -f "/tmp/release/${DARWIN_AARCH64_TGZ}.sig" ]; then
            DARWIN_AARCH64_SIG=$(cat "/tmp/release/${DARWIN_AARCH64_TGZ}.sig")
            DARWIN_AARCH64_URL="$BASE/$DARWIN_AARCH64_TGZ"
          else
            DARWIN_AARCH64_SIG=""
            DARWIN_AARCH64_URL=""
          fi

          # 1. Rewrite every existing platform URL to point at Spaces
          #    instead of github.com (running apps hit Spaces since the
          #    GitHub release is private).
          # 2. Inject linux-x86_64 entry for the slim AppImage.
          # 3. Inject darwin-aarch64 entry for the mac .dmg (when present).
          jq --arg base "$BASE" \
             --arg linuxurl "$BASE/$SLIM_APPIMAGE" \
             --arg linuxsig "$LINUX_SIG" \
             --arg macarmurl "$DARWIN_AARCH64_URL" \
             --arg macarmsig "$DARWIN_AARCH64_SIG" '
            .platforms |= (
              with_entries(
                .value.url = ($base + "/" + (.value.url | split("/") | .[-1]))
              )
            )
            | .platforms["linux-x86_64"] = { signature: $linuxsig, url: $linuxurl }
            | if $macarmurl != "" then
                .platforms["darwin-aarch64"] = { signature: $macarmsig, url: $macarmurl }
              else . end
          ' /tmp/release/latest.json > /tmp/release/latest.rewritten.json
          mv /tmp/release/latest.rewritten.json /tmp/release/latest.json
          echo "--- latest.json after rewrites ---"
          cat /tmp/release/latest.json

      - name: Upload to Spaces
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
          AWS_EC2_METADATA_DISABLED: "true"
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          BUCKET: ${{ secrets.SPACES_BUCKET }}
          REGION: ${{ secrets.SPACES_REGION }}
        run: |
          ENDPOINT="https://${REGION}.digitaloceanspaces.com"
          for f in /tmp/release/*; do
            name=$(basename "$f")
            aws s3 cp "$f" "s3://${BUCKET}/${TAG}/${name}" \
              --endpoint-url "$ENDPOINT" \
              --acl public-read
          done
          aws s3 cp /tmp/release/latest.json "s3://${BUCKET}/latest.json" \
            --endpoint-url "$ENDPOINT" \
            --acl public-read \
            --cache-control "max-age=60, public"
          echo "Published update channel: https://${BUCKET}.${REGION}.digitaloceanspaces.com/latest.json"
