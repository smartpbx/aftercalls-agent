[package]
name = "agent"
version = "0.34.0"
description = "aftercalls desktop agent — records calls, transcribes, summarizes."
authors = ["Clayton Mannerow <cmannerow@gmail.com>"]
license = "LicenseRef-Proprietary"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11.1", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
hound = "3.5"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
anyhow = "1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "fs", "process"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
rubato = "4"
earshot = "1"
uuid = { version = "1", features = ["v4"] }
# futures Sink/Stream extension traits for the tokio-tungstenite live-relay
# WebSocket (SinkExt::send/close, StreamExt::split/next). tokio-tungstenite's
# WebSocketStream is a futures Sink+Stream; these traits are the standard
# companion. Already resolved transitively (reqwest); promoted to a direct
# dep so the live module can `use` them.
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
toml = "0.8"
dirs = "5"
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
thiserror = "1"
# Local-only sqlite store of "apps that have used your microphone"
# (#596). `bundled` ships sqlite as part of the build artifact so we
# don't depend on the host's libsqlite — keeps cross-compiles to
# Windows + macOS from special-casing system libs. `chrono` enables
# the rfc3339 date roundtrip helpers we use for observed_apps timestamps.
rusqlite = { version = "0.31", features = ["bundled", "chrono"] }
# Pending-id generator for the auto-record cancel toast (#596). Pinned
# at 0.8 to match what reqwest's deps already drag in transitively, so
# we don't bloat the dep graph with a parallel 0.9 chain.
rand = "0.8"
# ZIP packaging for the "Include latest recording" toggle in the
# Submit Issue dialog (#628). `zip` is already a transitive dep
# (rfd → arboard, etc.); promote to direct so support.rs can use it.
# default-features stripped because we never write encrypted archives
# from the agent — saves the aes/bzip2/etc. sub-crates.
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4.11"

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6"
# Swift ↔ Rust FFI for the ScreenCaptureKit loopback shim
# (`macos/AftercallsLoopback.swift` + `src/macos_loopback.rs`). The
# bridge module is `cfg(target_os = "macos")`-gated so non-Mac builds
# never see this dep.
swift-bridge = "0.1"
# CoreAudio HAL FFI bindings for the audio observer (#597). The
# higher-level `coreaudio-rs` crate doesn't re-export the raw `sys`
# symbols by default, so we depend on `coreaudio-sys` directly for
# the property-list constants + `AudioObjectGetPropertyData` etc.
coreaudio-sys = "0.2"

[target.'cfg(target_os = "macos")'.build-dependencies]
swift-bridge-build = "0.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_Foundation",
  # #302 follow-up — Windows screen-source capture (gdigrab backend):
  # monitor enumeration (EnumDisplayMonitors/GetMonitorInfoW), window
  # enumeration (EnumWindows/GetWindowTextW/IsWindowVisible), and the
  # Job Object that ties the ffmpeg child's lifetime to the agent
  # (KILL_ON_JOB_CLOSE — the PDEATHSIG analog).
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_JobObjects",
  # CreateJobObjectW is #[cfg(feature = "Win32_Security")]-gated in
  # windows-0.58 and NOT implied by Win32_System_JobObjects; without this
  # `cargo check --target x86_64-pc-windows-msvc` fails to resolve it.
  "Win32_Security",
] }
tauri-winrt-notification = "0.7"

# Release profile tuned for CI iteration, not final-byte size. Thin LTO is
# ~95% of fat LTO's runtime quality at a fraction of the link time, and
# codegen-units=16 lets parallel codegen actually use the CI runner's cores.
# If we ship this to many users and shave bytes becomes a goal, flip lto
# back to "fat" and codegen-units to 1 for the final-release profile only.
[profile.release]
lto = "thin"
codegen-units = 16
strip = true

# wayland-scanner 0.31.10 on crates.io still requires vulnerable quick-xml
# 0.39.3 (RUSTSEC-2026-0194/0195). Keep the published source local with
# upstream's reviewed compatibility rename and 0.41 constraint until release.
# Compatibility: https://github.com/Smithay/wayland-rs/commit/ec2d932855593d48aa83c76820f3efbcfea86d39
# Security fix: https://github.com/Smithay/wayland-rs/commit/d07c4f91f28b42e5a485823ffd9d8d5a210b1053
[patch.crates-io]
wayland-scanner = { path = "vendor/wayland-scanner-0.31.10" }
