[package]
name = "agent"
version = "0.10.1"
description = "aftercalls desktop agent — records calls, transcribes, summarizes."
authors = ["Clayton Mannerow <cmannerow@gmail.com>"]
license = "LicenseRef-Proprietary"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
hound = "3.5"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "fs", "process"] }
toml = "0.8"
dirs = "5"
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
thiserror = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4.11"

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_Foundation",
] }
tauri-winrt-notification = "0.7"

# Release profile tuned for CI iteration, not final-byte size. Thin LTO is
# ~95% of fat LTO's runtime quality at a fraction of the link time, and
# codegen-units=16 lets parallel codegen actually use the CI runner's cores.
# If we ship this to many users and shave bytes becomes a goal, flip lto
# back to "fat" and codegen-units to 1 for the final-release profile only.
[profile.release]
lto = "thin"
codegen-units = 16
strip = true

